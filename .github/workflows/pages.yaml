name: Deploy Pages

on:
  push:
    branches: [main]
    paths: [versions.txt, ca/verify-bundle.pem, .github/workflows/pages.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install osslsigncode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode

      - name: Download and verify signed MSIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site
          printf '<!doctype html><title>marinaMoji downloads</title>\n' > site/index.html
          grep -vE '^\s*(#|$)' versions.txt | while read -r tag; do
            dir="site/windows/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -R marinaMoji/marinaMoji --dir "$dir" \
              -p '*.msi' -p SHA256SUMS
            [ "$(ls "$dir"/*.msi | wc -l)" -eq 2 ]
            (cd "$dir" && grep -E 'windows-.*\.msi$' SHA256SUMS | sha256sum -c -)
            # Every MSI must carry a VALID Authenticode signature that chains to
            # the pinned Certum CA bundle (with a verified timestamp, so it stays
            # valid after the certificate expires) AND was made by the project's
            # signing certificate. Merely containing a signature is not enough:
            # this is what the Microsoft Store will fetch.
            for f in "$dir"/*.msi; do
              out=$(osslsigncode verify -CAfile ca/verify-bundle.pem \
                      -TSA-CAfile ca/verify-bundle.pem -in "$f" 2>&1) \
                || { echo "$out"; echo "invalid or missing signature: $f"; exit 1; }
              grep -q 'Subject: CN=Open Source Developer Daniel Patrick Morgan,' <<<"$out" \
                || { echo "$out"; echo "unexpected signer: $f"; exit 1; }
            done
            rm "$dir/SHA256SUMS"
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
